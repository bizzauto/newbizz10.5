<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="baGrad" x1="200" y1="160" x2="900" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#29ABE2"/>
      <stop offset="0.55" stop-color="#1B6EF3"/>
      <stop offset="1" stop-color="#7B2FF7"/>
    </linearGradient>
    <linearGradient id="swooshGrad" x1="140" y1="660" x2="900" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7B2FF7"/>
      <stop offset="0.5" stop-color="#3D7BFF"/>
      <stop offset="1" stop-color="#29ABE2"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="640" y1="640" x2="960" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B6EF3"/>
      <stop offset="1" stop-color="#7B2FF7"/>
    </linearGradient>
    <linearGradient id="circuitGrad" x1="110" y1="560" x2="380" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7B2FF7"/>
      <stop offset="1" stop-color="#1B6EF3"/>
    </linearGradient>
  </defs>

  <!-- ======= BA MONOGRAM ======= -->
  <text x="512" y="520" text-anchor="middle"
        font-family="'Arial Black', Arial, sans-serif" font-weight="900"
        font-size="430" letter-spacing="-18" fill="url(#baGrad)">BA</text>

  <!-- ======= CIRCUIT LINES (left of B) ======= -->
  <g stroke="url(#circuitGrad)" stroke-width="14" fill="none" stroke-linecap="round">
    <path d="M 175 325 H 300 L 345 370"/>
    <path d="M 150 420 H 310"/>
    <path d="M 175 515 H 300 L 345 470"/>
  </g>
  <g fill="none" stroke-width="14">
    <circle cx="150" cy="325" r="16" stroke="#1B6EF3"/>
    <circle cx="122" cy="420" r="16" stroke="#3D7BFF"/>
    <circle cx="150" cy="515" r="16" stroke="#7B2FF7"/>
  </g>

  <!-- ======= GROWTH SWOOSH + ARROW ======= -->
  <path d="M 130 655 C 330 700, 640 640, 838 392 L 806 380 L 872 318 L 892 402 L 856 396 C 660 660, 330 730, 122 684 Z"
        fill="url(#swooshGrad)"/>

  <!-- ======= WORDMARK ======= -->
  <text x="512" y="742" text-anchor="middle"
        font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800"
        font-size="118" letter-spacing="-2">
    <tspan fill="#0F1B33">BizzAuto</tspan><tspan fill="url(#aiGrad)"> AI</tspan>
  </text>

  <!-- ======= TAGLINE ======= -->
  <line x1="96" y1="796" x2="176" y2="796" stroke="#7B2FF7" stroke-width="5" stroke-linecap="round"/>
  <text x="512" y="806" text-anchor="middle"
        font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="600"
        font-size="30" letter-spacing="7" fill="#1F2A44">ALL-IN-ONE BUSINESS AUTOMATION</text>
  <line x1="848" y1="796" x2="928" y2="796" stroke="#29ABE2" stroke-width="5" stroke-linecap="round"/>

  <!-- ======= 4 PILLARS ======= -->
  <!-- AUTOMATE: gear -->
  <g transform="translate(160,900)">
    <circle cx="40" cy="34" r="26" fill="none" stroke="#1B6EF3" stroke-width="9"/>
    <g stroke="#1B6EF3" stroke-width="9" stroke-linecap="round">
      <line x1="40" y1="-2" x2="40" y2="8"/>
      <line x1="40" y1="60" x2="40" y2="70"/>
      <line x1="4" y1="34" x2="14" y2="34"/>
      <line x1="66" y1="34" x2="76" y2="34"/>
      <line x1="14" y1="8" x2="21" y2="15"/>
      <line x1="59" y1="53" x2="66" y2="60"/>
      <line x1="66" y1="8" x2="59" y2="15"/>
      <line x1="21" y1="53" x2="14" y2="60"/>
    </g>
    <circle cx="40" cy="34" r="10" fill="#1B6EF3"/>
    <text x="40" y="102" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="21" letter-spacing="2" fill="#1F2A44">AUTOMATE</text>
  </g>

  <!-- ANALYZE: bar chart -->
  <g transform="translate(320,900)">
    <rect x="18" y="40" width="13" height="26" rx="3" fill="#1B6EF3"/>
    <rect x="37" y="26" width="13" height="40" rx="3" fill="#3D7BFF"/>
    <rect x="56" y="12" width="13" height="54" rx="3" fill="#7B2FF7"/>
    <path d="M 18 34 L 43 18 L 69 4" stroke="#F59E0B" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M 58 4 L 71 3 L 69 16 Z" fill="#F59E0B"/>
    <text x="45" y="102" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="21" letter-spacing="2" fill="#1F2A44">ANALYZE</text>
  </g>

  <!-- ENGAGE: chat bubble -->
  <g transform="translate(500,900)">
    <path d="M 12 12 h 62 a 10 10 0 0 1 10 10 v 30 a 10 10 0 0 1 -10 10 H 44 L 28 76 V 62 H 12 a 10 10 0 0 1 -10 -10 V 22 a 10 10 0 0 1 10 -10 Z" fill="#1B6EF3"/>
    <circle cx="27" cy="37" r="5.5" fill="#fff"/>
    <circle cx="43" cy="37" r="5.5" fill="#fff"/>
    <circle cx="59" cy="37" r="5.5" fill="#fff"/>
    <text x="45" y="102" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="21" letter-spacing="2" fill="#1F2A44">ENGAGE</text>
  </g>

  <!-- GROW: people -->
  <g transform="translate(690,900)">
    <circle cx="45" cy="18" r="13" fill="#7B2FF7"/>
    <path d="M 22 62 a 23 20 0 0 1 46 0 Z" fill="#7B2FF7"/>
    <circle cx="15" cy="24" r="10" fill="#3D7BFF"/>
    <path d="M -4 60 a 19 17 0 0 1 30 -14" fill="#3D7BFF"/>
    <circle cx="75" cy="24" r="10" fill="#29ABE2"/>
    <path d="M 94 60 a 19 17 0 0 0 -30 -14" fill="#29ABE2"/>
    <text x="45" y="102" text-anchor="middle" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="21" letter-spacing="2" fill="#1F2A44">GROW</text>
  </g>
</svg>
