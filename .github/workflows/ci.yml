name: CI — Server Build & Typecheck

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  server:
    name: Server (tsc 0 errors + esbuild build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck (server) — must be 0 errors
        run: npx tsc --noEmit -p tsconfig.server.json

      - name: Build server + worker bundle
        run: node scripts/build-server.js
